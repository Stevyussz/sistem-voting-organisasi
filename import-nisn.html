  const firebaseConfig = {
    apiKey: "AIzaSyBh43k_YWVXGGxpjcopJUQBxCEtkLYU9Fo",
    authDomain: "voting-pm26.firebaseapp.com",
    projectId: "voting-pm26",
    storageBucket: "voting-pm26.firebasestorage.app",
    messagingSenderId: "241867093185",
    appId: "1:241867093185:web:d72fd8350210617b851040",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function log(msg, cls='info') {
    const div = document.getElementById('log');
    div.innerHTML += `<span class="${cls}">${msg}</span>\n`;
    div.scrollTop = div.scrollHeight;
  }

  async function startImport() {
    const btn = document.getElementById('btnStart');
    btn.disabled = true;
    const total = NISN_LIST.length;
    log(`🚀 Memulai import ${total} NISN ke Firestore...`, 'info');

    let ok = 0, skip = 0, fail = 0;
    const BATCH_SIZE = 400; // Firestore max 500 per batch

    for (let i = 0; i < total; i += BATCH_SIZE) {
      const chunk = NISN_LIST.slice(i, i + BATCH_SIZE);
      const batch = db.batch();

      // Check existing first
      for (const nisn of chunk) {
        const ref = db.collection('tokens').doc(nisn);
        batch.set(ref, { used: false, usedAt: null }, { merge: false });
      }

      try {
        // We use set with merge:false — but to avoid overwriting already-used tokens,
        // we should check first. Let's do it safely with individual writes
        // (batched but check-before-write logic):
        const checkPromises = chunk.map(async nisn => {
          try {
            const snap = await db.collection('tokens').doc(nisn).get();
            if (snap.exists) {
              skip++;
              return null; // skip
            }
            return nisn;
          } catch(e) {
            fail++;
            log(`✗ Error cek ${nisn}: ${e.message}`, 'err');
            return null;
          }
        });

        const toWrite = (await Promise.all(checkPromises)).filter(Boolean);

        if (toWrite.length > 0) {
          const batch2 = db.batch();
          toWrite.forEach(nisn => {
            batch2.set(db.collection('tokens').doc(nisn), { used: false, usedAt: null });
          });
          await batch2.commit();
          ok += toWrite.length;
        }

        const pct = Math.round(((i + chunk.length) / total) * 100);
        document.getElementById('fill').style.width = pct + '%';
        document.getElementById('progress').textContent =
          `Progress: ${Math.min(i + chunk.length, total)}/${total} (${pct}%) — ✓ ${ok} ditulis · ⊙ ${skip} sudah ada · ✗ ${fail} gagal`;

        log(`Batch ${Math.floor(i/BATCH_SIZE)+1}: ${toWrite.length} ditulis, ${chunk.length - toWrite.length} dilewati`, 'ok');
      } catch(e) {
        fail += chunk.length;
        log(`✗ Batch error: ${e.message}`, 'err');
      }

      // small delay to avoid rate limiting
      await new Promise(r => setTimeout(r, 500));
    }

    log(`\n✅ SELESAI: ${ok} NISN berhasil diimport, ${skip} sudah ada, ${fail} gagal.`, 'ok');
    document.getElementById('progress').textContent = `✅ Selesai! ${ok} NISN berhasil diimport ke Firestore collection 'tokens'.`;
    btn.textContent = '✅ Import Selesai';
  }
